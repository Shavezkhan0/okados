name: okados_user_app
description: Okados - Food Delivery Customer App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6
  google_fonts: ^8.0.2
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.0
  shimmer: ^3.0.0
  smooth_page_indicator: ^2.0.1
  flutter_rating_bar: ^4.0.1
  badges: ^3.1.2

  go_router: ^17.1.0

  dio: ^5.4.0
  pretty_dio_logger: ^1.3.1
  connectivity_plus: ^7.0.0
  socket_io_client: ^3.0.2

  shared_preferences: ^2.2.2
  flutter_secure_storage: ^10.0.0

  geolocator: ^14.0.2
  geocoding: ^4.0.0
  google_maps_flutter: ^2.5.0

  firebase_core: ^4.4.0
  firebase_messaging: ^16.1.1
  firebase_analytics: ^12.1.2

  razorpay_flutter: ^1.3.6

  shorebird_code_push: ^2.0.5

  intl: ^0.20.2
  url_launcher: ^6.2.2
  image_picker: ^1.0.5
  permission_handler: ^12.0.1
  package_info_plus: ^9.0.0
  device_info_plus: ^12.3.0
  flutter_local_notifications: ^20.1.0
  
  flutter_form_builder: ^10.3.0+2
  form_builder_validators: ^11.3.0

  lottie: ^3.3.2
  animations: ^2.0.11

  equatable: ^2.0.5
  logger: ^2.0.2+1
  flutter_dotenv: ^6.0.0

  flutter_riverpod: ^2.4.0
  riverpod_annotation: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^2.3.0
  build_runner: ^2.4.7
  riverpod_lint: ^2.3.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/lottie/
    - .env
